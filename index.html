<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>校园墙</title>
  <meta name="description" content="校园表白墙：匿名表白、树洞、寻人与致谢，还有可以署名的论坛与私信。" />
  <meta name="theme-color" content="#f7f7f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <!-- 不收录：站内是校园用户生成内容，被搜索引擎快照对学生没有好处 -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1d1f'/%3E%3Ctext x='16' y='22' font-size='17' font-family='PingFang SC,Microsoft YaHei,sans-serif' fill='%23ffffff' text-anchor='middle'%3E%E5%A2%99%3C/text%3E%3C/svg%3E" />

  <!--
    首屏加载页。

    为什么要内联在 HTML 里：JS 包还没下载/解析完的时候，页面是一片空白 ——
    网速慢时这段空白可能持续 2 秒以上。把加载页写死在 HTML 里，浏览器一拿到
    HTML 就能画出来，**不依赖任何 JS 包**，用户第一时间看到的是品牌而不是白屏。

    动画只动 transform/opacity：高刷屏（60–185Hz）上也只有合成层变化，不触发重排。
  -->
  <style>
    html, body { margin: 0; padding: 0; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px;
      background: #f7f7f9;
      color: #1d1d1f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      transition: opacity 260ms ease;
      will-change: opacity;
    }
    @media (prefers-color-scheme: dark) {
      #splash { background: #000; color: #f5f5f7; }
    }
    #splash.is-done { opacity: 0; }
    #splash .splash-word { display: flex; gap: 6px; }
    /* 逐字跳动：每个字用 --i 错开 90ms，位移只有 6px，幅度小才不显得吵 */
    #splash .splash-ch {
      display: inline-block;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.04em;
      animation: splashHop 1.05s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      animation-delay: calc(var(--i) * 90ms);
      will-change: transform;
    }
    @keyframes splashHop {
      0%, 62%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }
    #splash .splash-bar {
      width: 92px; height: 3px; border-radius: 99px; overflow: hidden;
      background: currentColor; opacity: 0.12;
    }
    #splash .splash-bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 99px;
      background: currentColor; opacity: 0.9;
      animation: splashSlide 1.1s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes splashSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    #splash .splash-tip { font-size: 12px; opacity: 0.5; letter-spacing: 0.06em; }
    @media (prefers-reduced-motion: reduce) {
      #splash .splash-ch, #splash .splash-bar::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite" aria-label="正在加载">
    <div class="splash-word" aria-hidden="true">
      <span class="splash-ch" style="--i:0">校</span><span class="splash-ch" style="--i:1">园</span><span class="splash-ch" style="--i:2">墙</span>
    </div>
    <div class="splash-bar" aria-hidden="true"></div>
    <div class="splash-tip">正在加载…</div>
  </div>

  <div id="root"></div>

  <!-- Vite 入口：必须位于 Vite root（仓库根）之下，构建时由 Vite 接管 -->
  <script type="module" src="/web/src/main.jsx"></script>

  <script>
    /**
     * 收起加载页。由 App 在首屏数据就绪后调用；这里再兜一层超时 ——
     * 万一 JS 包挂了，也不能让用户永远看着加载页。
     */
    window.__hideSplash = function () {
      var el = document.getElementById('splash');
      if (!el) return;
      el.classList.add('is-done');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
    };
    setTimeout(window.__hideSplash, 5000);
  </script>
</body>
</html>
