      + '<span class="spacer"></span>'
      + syncBtn + '</div>';
    const body = items.length
      ? '<ul class="q-list">' + items.map(afdianRowHtml).join('') + '</ul>'
        + (state.afdianNext
          ? '<div style="display:flex;justify-content:center;margin-top:var(--space-5)"><button class="btn btn-secondary" type="button" data-act="afdian-more">加载更多</button></div>'
          : '')
      : emptyState(
        state.afdianFilter === 'unbound' ? '没有待绑定的订单' : (state.afdianFilter === 'bound' ? '还没有绑定用户的订单' : '还没有赞助订单'),
        '订单由爱发电回调写入；回调漏了可以用右上角「从爱发电同步订单」按订单号补单，重复补单不会重复发奖。');
    return afdianBannerHtml(s) + afdianStatusHtml(s)
      + '<div style="margin-top:var(--space-5)">' + afdianTilesHtml(s) + afdianRuleHtml(s) + '</div>'
      + '<div style="margin-top:var(--space-5)">' + toolbar + body + '</div>'
      + afdianHooksHtml();
  }

  async function renderAfdian(more) {
    const el = $('#view-afdian');
    if (!more) {
      state.afdianItems = [];
      state.afdianNext = null;
      el.innerHTML = skeleton(3);
    }
    try {
      const res = await store.afdian({ filter: state.afdianFilter, cursor: more ? state.afdianNext : 0 });
      state.cache.afdian = res;
      state.afdianStats = res.stats || null;
      state.afdianWebhooks = res.recentWebhooks || [];
      state.afdianNext = res.nextCursor || null;
      state.afdianItems = more ? state.afdianItems.concat(res.items || []) : (res.items || []);
      state.afdianFilter = res.filter || state.afdianFilter;
      if (more && !(res.items || []).length) toast('没有更多订单', 'warn');
      el.innerHTML = afdianHtml();
      updateNavCounts();
    } catch (e) {
      if (handleApiError(e)) return;
      if (more) { toast('加载更多失败：' + errText(e), 'danger'); return; }
      state.afdianStats = null;
      el.innerHTML = errorState(errText(e));
      updateNavCounts();
    }
  }

  /* ───────────────────────── 视图切换 / 计数 ───────────────────────── */

  function setView(view) {
    state.view = view;
    const meta = VIEW_META[view];
    $('#viewTitle').textContent = meta.title;
    $('#viewSub').textContent = meta.sub;
    $$('.nav-item').forEach((btn) => {
      if (btn.dataset.view === view) btn.setAttribute('aria-current', 'page');
      else btn.removeAttribute('aria-current');
    });
    VIEW_IDS.forEach((v) => { const section = $('#view-' + v); if (section) section.hidden = v !== view; });
    syncQueueSearch();
    renderCurrent();
  }

  // 论坛队列不支持关键字搜索（服务端只按状态取待审），宁可不显示搜索框
  function syncQueueSearch() {
    $('#searchWrap').hidden = state.view !== 'queue' || FORUM_TYPES.indexOf(state.queueType) >= 0;
  }

  function renderCurrent() {
    if (state.view === 'overview') return renderOverview();
    if (state.view === 'queue') return renderQueue();
    if (state.view === 'reports') return renderReports();
    if (state.view === 'users') return renderUsers();
    if (state.view === 'titles') return renderTitles();
    if (state.view === 'announcements') return renderAnnouncements();
    if (state.view === 'schools') return renderSchools();
    if (state.view === 'afdian') return renderAfdian();
    if (state.view === 'feedback') return renderFeedback();
    return renderAudit();
  }

  function updateNavCounts() {
    const s = state.stats;
    const set = (key, value, tone) => {
      const el = document.querySelector('.nav-count[data-count="' + key + '"]');
      if (!el) return;
      el.textContent = value ? String(value) : '';
      if (tone) el.dataset.tone = tone; else delete el.dataset.tone;
    };
    if (s) {
      set('overview', s.pendingTotal || 0, 'warn');
      set('queue', (s.pendingPosts || 0) + (s.pendingComments || 0) + (s.pendingThreads || 0) + (s.pendingReplies || 0), 'warn');
      set('reports', s.openReports || 0, 'warn');
      set('feedback', s.openFeedback || 0, 'warn');
      set('users', s.users || 0); // 灰色：账号规模是参考值，不是待办
      set('audit', '');
    }
    // 赞助：待绑定单数只有取过 /api/admin/afdian 才知道，没访问过视图就不显示（不额外发请求）
    set('afdian', state.afdianStats ? (state.afdianStats.unbound || 0) : '', 'warn');
  }

  // 版本状态与「已连接」并列展示：侧栏常驻一行，
  // 「连接设置」里再写一遍，排查线上部署版本时不用翻日志。
  function versionLabel(stats) {
    return stats && stats.version ? '服务端 v' + stats.version : '版本未知（未连接后端）';
  }

  function setVersionStatus(stats) {
    const s = stats || state.stats;
    const box = $('#version');
    const text = $('#versionText');
    if (!box || !text) return;
    box.dataset.mode = s && s.version ? 'live' : 'demo';
    text.textContent = versionLabel(s);
  }

  /* ───────────────────────── 帖子详情 ───────────────────────── */

  async function openDetail(id, trigger) {
    state.detailTrigger = trigger || null;
    openModal('<div class="modal-head"><div><h2 id="modalTitle">帖子详情</h2><p class="sub">#' + esc(id) + '</p></div>'
      + '<button class="iconbtn" type="button" data-close aria-label="关闭">' + CLOSE_ICON + '</button></div>'
      + '<div class="modal-body">' + skeleton(2) + '</div>');
    try {
      const data = await store.detail(id);
      const p = data.post;
      const statusBadge = '<span class="badge" data-status="' + (p.status === 'approved' ? 'actioned' : p.status) + '">' + esc(STATUS_LABEL[p.status] || p.status) + '</span>';
      let html = '<div class="detail-body">'
        + '<div class="od-cluster"><span class="chip">' + esc(p.cat) + '</span>' + statusBadge + flagChips(p.flag) + '</div>'
        + '<div class="detail-quote">' + esc(p.body) + '</div>'
        + '<div class="od-row" style="gap:var(--space-5);flex-wrap:wrap"><span class="meta">点赞 <span class="mono">' + esc(p.likes) + '</span></span>'
        + '<span class="meta">评论 <span class="mono">' + esc(p.comments) + '</span></span>'
        + '<span class="meta">发布于 ' + fmtDate(p.createdAt) + '</span></div>';
      if (data.reports && data.reports.length) {
        html += '<div><h3 style="font-size:var(--text-sm);font-weight:600;margin-bottom:8px">相关工单</h3><div class="detail-list">'
          + data.reports.map((r) => '<div class="detail-item">' + esc(r.reason || '未填写') + '<div class="sub">' + esc(STATUS_LABEL[r.status] || r.status) + ' · ' + fmtDate(r.createdAt) + '</div></div>').join('')
          + '</div></div>';
      }
      html += '<div><h3 style="font-size:var(--text-sm);font-weight:600;margin-bottom:8px">评论（' + (data.comments ? data.comments.length : 0) + '）</h3>';
      html += data.comments && data.comments.length
        ? '<div class="detail-list">' + data.comments.map((c) => '<div class="detail-item">' + esc(c.body)
            + '<div class="sub">' + esc(STATUS_LABEL[c.status] || c.status) + ' · ' + fmtDate(c.createdAt) + (c.flag ? ' · ' + esc(flagLabel(c.flag)) : '') + '</div></div>').join('') + '</div>'
        : '<p class="meta">暂无评论。</p>';
      html += '</div></div>';

      const actions = (p.status === 'pending')
        ? '<button class="btn btn-primary" type="button" data-act="post.approve" data-id="' + p.id + '">通过</button>'
          + '<button class="btn btn-secondary" type="button" data-act="post.reject" data-id="' + p.id + '">驳回</button>'
          + '<button class="btn btn-danger-ghost" type="button" data-act="post.remove" data-id="' + p.id + '">下架</button>'
        : (p.status === 'approved' ? '<button class="btn btn-danger-ghost" type="button" data-act="post.remove" data-id="' + p.id + '">下架</button>' : '');

      const card = $('#modalCard');
      card.innerHTML = '<div class="modal-head"><div><h2 id="modalTitle">帖子详情</h2><p class="sub">#' + esc(p.id) + '</p></div>'
        + '<button class="iconbtn" type="button" data-close aria-label="关闭">' + CLOSE_ICON + '</button></div>'
        + '<div class="modal-body">' + html + '</div>'
        + '<div class="modal-foot"><button class="btn btn-secondary" type="button" data-close>关闭</button>' + actions + '</div>';
    } catch (e) {
      if (handleApiError(e)) { closeModal(); return; }
      $('#modalCard').innerHTML = '<div class="modal-head"><div><h2 id="modalTitle">帖子详情</h2></div>'
        + '<button class="iconbtn" type="button" data-close aria-label="关闭">' + CLOSE_ICON + '</button></div>'
        + '<div class="modal-body">' + errorState(errText(e)) + '</div>';
    }
  }

  /* ───────────────────────── 动作处理 ───────────────────────── */

  // 渲染/操作过程中的接口错误：不改动连接模式，只如实提示并让调用方显示错误态，
  // 避免「后端其实没连上，界面却显示成成功」这种误导。
  function handleApiError(e) {
    if (e && e.status === 401) {
      toast('管理员令牌无效或已过期，请在“连接设置”中更新', 'danger');
    }
    return false;
  }

  const NEEDS_CONFIRM = {
    'post.remove': { title: '下架这条内容？', body: '下架后内容将立即从公开墙移除，并连带结清该帖的待处理工单。', confirmText: '下架', danger: true },
    'post.reject': { title: '驳回这条内容？', body: '驳回后内容不会出现在公开墙，帖子会保留在库中以便复查。', confirmText: '驳回', danger: true }
  };

  async function runAction(act, id, el) {
    try {
      // data-act 用的是「带前缀的动作名」（post.approve / comment.reject），
      // 它同时是审核日志里的 action 文案。但接口要的是**裸动作**：
      //   POST /api/admin/posts/:id/approve|reject|remove
      //   POST /api/admin/comments/:id/approve|reject
      // 大坑（已踩过）：直接把 act 拼进 URL 会变成
      //   POST /api/admin/posts/7/post.approve → 404 not_found，
      // 界面上表现为「点通过没反应、只弹一句操作失败」。
      // 服务端只认裸动作（approve / reject / remove），带上前缀会一路错到底，
      // 因此统一在这里剥前缀，两处调用点都受益。
      const verb = String(act).split('.').pop();

      if (act === 'post.approve' || act === 'post.reject' || act === 'post.remove') {
        if (NEEDS_CONFIRM[act]) {
          const yes = await confirmDialog(NEEDS_CONFIRM[act]);
          if (!yes) return;
        }
        if (el) el.disabled = true;
        await store.reviewPost(Number(id), verb);
        state.queueSel.delete(Number(id));
        toast('已' + (act === 'post.approve' ? '通过' : act === 'post.reject' ? '驳回' : '下架') + '帖子 #' + id, act === 'post.approve' ? 'ok' : 'danger');
        await refreshAfterAction();
        return;
      }
      if (act === 'comment.approve' || act === 'comment.reject') {
        if (el) el.disabled = true;
        await store.reviewComment(Number(id), verb);
        state.queueSel.delete(Number(id));
        toast('已' + (act === 'comment.approve' ? '通过' : '驳回') + '评论 #' + id, act === 'comment.approve' ? 'ok' : 'danger');
        await refreshAfterAction();
        return;
      }
      if (act === 'report.takedown') {
        const yes = await confirmDialog({ title: '下架被举报内容？', body: '内容将从公开墙移除，该帖的全部待处理工单会一并结案。', confirmText: '下架并结案', danger: true });
        if (!yes) return;
        if (el) el.disabled = true;
        await store.resolveReport(Number(id), 'takedown');
        toast('已下架并结案', 'danger');
        await refreshAfterAction();
        return;
      }
      if (act === 'report.dismiss') {
        if (el) el.disabled = true;
        await store.resolveReport(Number(id), 'dismiss');
        toast('已驳回工单 #' + id, 'ok');
        await refreshAfterAction();
        return;
      }
      if (act === 'feedback.toggle') {
        const fid = Number(id);
        if (state.feedbackExpanded.has(fid)) state.feedbackExpanded.delete(fid);
        else state.feedbackExpanded.add(fid);
        // 只重绘这一行：折叠/展开不需要重新拉取整个队列
        const cached = state.cache.feedback;
        const item = cached && cached.items.filter((x) => x.id === fid)[0];
        const row = el && el.closest('.q-row');
        if (item && row) {
          row.outerHTML = feedbackRowHtml(item);
          const next = $('#view-feedback [data-od-id="feedback-' + fid + '"] [data-act="feedback.toggle"]');
          if (next) next.focus(); // 键盘操作后焦点回到同一个按钮上
        }
        return;
      }
      if (act === 'feedback.done' || act === 'feedback.dismiss') {
        const done = act === 'feedback.done';
        if (el) el.disabled = true;
        await store.resolveFeedback(Number(id), done ? 'done' : 'dismiss');
        toast(done ? '已标记反馈 #' + id + ' 为已处理' : '已忽略反馈 #' + id, done ? 'ok' : 'danger');
        await refreshAfterAction();
        return;
      }
      if (act === 'thread.approve' || act === 'thread.reject' || act === 'thread.remove'
        || act === 'reply.approve' || act === 'reply.reject' || act === 'reply.remove') {
        const isThread = act.indexOf('thread.') === 0;
        const verb = act.split('.').pop();
        const label = (isThread ? '主题' : '回复') + ' #' + id;
        if (verb !== 'approve') {
          const yes = await confirmDialog({
            title: verb === 'reject' ? '驳回这条' + (isThread ? '主题' : '回复') + '？' : '删除这条' + (isThread ? '主题' : '回复') + '？',
            body: verb === 'reject'
              ? label + ' 将不会出现在论坛，记录保留在库中以便复查。'
              : label + ' 将从论坛移除，对应的计数与经验一并回退。',
            confirmText: verb === 'reject' ? '驳回' : '删除',
            danger: true
          });
          if (!yes) return;
        }
        if (el) el.disabled = true;
        if (isThread) await store.reviewThread(Number(id), verb);
        else await store.reviewReply(Number(id), verb);
        toast('已' + (verb === 'approve' ? '通过' : verb === 'reject' ? '驳回' : '删除') + label, verb === 'approve' ? 'ok' : 'danger');
        await refreshAfterAction();
        return;
      }
      if (act === 'email.test') {
      const input = $('#emailTestTo');
      const box = $('#emailTestResult');
      const to = input ? String(input.value || '').trim() : '';
      if (!to) { toast('先填一个收件地址', 'warn'); return; }
      if (box) box.textContent = '正在发送…';
      try {
        const r = await store.emailTest(to);
        if (r && r.ok) {
          const delivered = (r.delivered || []).join('、');
          if (box) {
            box.innerHTML = '<span style="color:var(--success)">已交给 Cloudflare</span>'
              + (delivered ? '（已投递：' + esc(delivered) + '）' : '（已受理，稍等片刻查收）');
          }
          toast('测试邮件已发送', 'ok');
        } else {
          if (box) {
            box.innerHTML = '<span style="color:var(--danger)">发送失败：' + esc((r && r.error) || '未知错误') + '</span>'
              + (r && r.degraded ? '<br>未配置邮件通道时，验证码只会写进服务端日志与 outbox。' : '');
          }
          toast('发送失败，卡片里有原因', 'danger');
        }
      } catch (err) {
        if (box) box.innerHTML = '<span style="color:var(--danger)">请求失败：' + esc(errText(err)) + '</span>';
      }
      return;
    }
    if (act === 'user.open') { await openUserDetail(Number(id), el || null); return; }
      if (act === 'user.apply') { await runUserAction(Number(id), el ? el.dataset.op : '', el); return; }
      if (act === 'title.new') { openModal(titleFormHtml(null)); return; }
      if (act === 'title.edit') {
        const t = findCached('titles', id);
        if (!t) { toast('头衔不存在，请刷新后重试', 'danger'); return; }
        openModal(titleFormHtml(t));
        return;
      }
      if (act === 'title.save') { await saveTitle(id); return; }
      if (act === 'title.delete') {
        const t = findCached('titles', id) || { name: '#' + id, userCount: 0 };
        const yes = await confirmDialog({
          title: '删除头衔？',
          body: '「' + t.name + '」将被删除，持有它的 ' + (t.userCount || 0) + ' 位用户会立刻失去该头衔，且无法恢复。',
          confirmText: '删除',
          danger: true
        });
        if (!yes) return;
        await store.deleteTitle(Number(id));
        toast('已删除头衔「' + t.name + '」', 'danger');
        await refreshAfterAction();
        return;
      }
      if (act === 'ann.new') { openModal(annFormHtml(null)); return; }
      if (act === 'ann.edit') {
        const a = findCached('announcements', id);
        if (!a) { toast('公告不存在，请刷新后重试', 'danger'); return; }
        openModal(annFormHtml(a));
        return;
      }
      if (act === 'ann.save') { await saveAnnouncement(id); return; }
      if (act === 'ann.toggle') {
        const a = findCached('announcements', id);
        if (!a) { toast('公告不存在，请刷新后重试', 'danger'); return; }
        if (el) el.disabled = true;
        await store.saveAnnouncement(Number(id), { active: !a.active });
        toast(a.active ? '已停用公告 #' + id : '已启用公告 #' + id, a.active ? 'danger' : 'ok');
        await refreshAfterAction();
        return;
      }
      if (act === 'ann.delete') {
        const a = findCached('announcements', id);
        const yes = await confirmDialog({
          title: '删除公告？',
          body: '公告 #' + id + ' 将被永久删除' + (a ? '：' + String(a.body).slice(0, 40) : '') + '。',
          confirmText: '删除',
          danger: true
        });
        if (!yes) return;
        await store.deleteAnnouncement(Number(id));
        toast('已删除公告 #' + id, 'danger');
        await refreshAfterAction();
        return;
      }
      if (act === 'school.new') { openModal(schoolFormHtml(null)); return; }
      if (act === 'school.edit') {
        const s = findCached('schools', id);
        if (!s) { toast('学校不存在，请刷新后重试', 'danger'); return; }
        openModal(schoolFormHtml(s));
        return;
      }
      if (act === 'school.save') { await saveSchool(id); return; }
      if (act === 'school.toggle') {
        const s = findCached('schools', id);
        if (!s) { toast('学校不存在，请刷新后重试', 'danger'); return; }
        if (el) el.disabled = true;
        await store.saveSchool(Number(id), { active: !s.active });
        toast(s.active ? '已停用「' + s.name + '」' : '已启用「' + s.name + '」', s.active ? 'danger' : 'ok');
        await refreshAfterAction();
        return;
      }
      if (act === 'school.delete') {
        const s = findCached('schools', id) || { name: '#' + id, userCount: 0 };
        const yes = await confirmDialog({
          title: '删除学校？',
          body: '「' + s.name + '」将从名单移除，新用户不能再选择它；已选该校的 ' + (s.userCount || 0) + ' 位用户不受影响（校名是快照，本来就不可更改）。',
          confirmText: '删除',
          danger: true
        });
        if (!yes) return;
        await store.deleteSchool(Number(id));
        toast('已删除「' + s.name + '」', 'danger');
        await refreshAfterAction();
        return;
      }
      if (act === 'afdian.copy') {
        try {
          await copyText(afdianWebhookUrl());
          toast('回调地址已复制，粘到爱发电开发者页的回调设置里', 'ok');
        } catch (e) {
          toast('复制失败，请手动选中地址复制：' + afdianWebhookUrl(), 'danger');
        }
        return;
      }
      if (act === 'afdian.bind') {
        const o = findCached('afdian', id);
        if (!o) { toast('订单不存在，请刷新后重试', 'danger'); return; }
        openModal(afdianBindFormHtml(o));
        return;
      }
      if (act === 'afdian.bind.save') {
        const uuid = String(($('#afUuid') || {}).value || '').trim();
        if (!uuid) { toast('请先填用户 uuid', 'danger'); return; }
        if (el) el.disabled = true;
        try {
          const res = await store.afdianBind(Number(id), uuid);
          toast('已把订单 #' + id + ' 绑给 ' + ((res.user && res.user.nickname) || uuid) + (res.reward ? ' · ' + res.reward : ''), 'ok');
        } catch (e) {
          // 这里单独 catch：uuid 抄错是最常见的失败，要给一句能照着做的人话，而不是通用错误。
          // 错误码有的挂在 code 上、有的挂在 message 上，两个都要认。
          if (el) el.disabled = false;
          const code = (e && (e.code || e.message)) || '';
          toast(code === 'user_not_found'
            ? '没有这个用户：uuid 抄错了，或对方还没注册（可在「用户」里搜昵称核对）'
            : (code === 'not_found' ? '订单不存在，请刷新后重试' : '绑定失败：' + errText(e)), 'danger');
          return;
        }
        closeModal();
        await refreshAfterAction();
        return;
      }
      if (act === 'afdian.ignore') {
        const o = findCached('afdian', id);
        const yes = await confirmDialog({
          title: '忽略这单？',
          body: '订单 #' + id + (o ? '（' + o.outTradeNo + '，¥' + (o.amount || '0.00') + '）' : '')
            + ' 会标记为已忽略，不再出现在「待绑定」里；已经发出去的奖励不会收回。',
          confirmText: '忽略',
          danger: true
        });
        if (!yes) return;
        if (el) el.disabled = true;
        await store.afdianIgnore(Number(id));
        toast('已忽略订单 #' + id, 'danger');
        await refreshAfterAction();
        return;
      }
      if (act === 'afdian.sync') {
        const st = state.afdianStats || {};
        if (!st.apiReady) {
          toast('未配置 AFDIAN_USER_ID / AFDIAN_TOKEN，无法从爱发电拉取订单', 'danger');
          return;
        }
        if (el) el.disabled = true;
        let res;
        try {
          res = await store.afdianSync(3);
        } catch (e) {
          if (el) el.disabled = false;
          toast((e && (e.code || e.message)) === 'afdian_not_configured'
            ? '未配置 AFDIAN_USER_ID / AFDIAN_TOKEN，无法从爱发电拉取订单'
            : '同步失败：' + errText(e), 'danger');
          return;
        }
        // 服务端把每页的失败原因拼成「第 N 页：xxx」的数组，原样带出来即可，不再包一层页码
        const errs = res.errors || [];
        toast('导入 ' + (res.imported || 0) + ' 单，已存在 ' + (res.duplicated || 0) + ' 单'
          + (errs.length ? ' · 拉取失败：' + errs[0] : ''), errs.length ? 'warn' : 'ok');
        await refreshAfterAction();
        return;
      }
      if (act === 'view') {
        await openDetail(Number(id), el || null);
        return;
      }
    } catch (e) {
      if (el) el.disabled = false;
      if (e.status === 401) { handleApiError(e); toast('登录状态失效，请重新连接后端', 'danger'); return; }
      toast('操作失败：' + errText(e), 'danger');
    }
  }

  /**
   * 用户管理动作。UI 只负责读控件、做二次确认与提示；
   * 真正的合法性判断在服务端（等级裁剪、昵称长度、状态白名单），前端不重复造一套规则，
   * 只拦住明显填错的输入，省一次往返。
   */
  async function runUserAction(id, op, el) {
    const val = (sel) => { const node = $(sel); return node ? node.value : ''; };
    const readers = {
      set_title: () => (val('#opTitle') === '' ? null : Number(val('#opTitle'))),
      set_level: () => Number(val('#opLevel')),
      set_exp: () => Number(val('#opExp')),
      reset_exp: () => 0,
      set_status: () => val('#opStatus'),
      rename: () => String(val('#opName')).trim(),
      clear_nickname_flag: () => null
    };
    if (!readers[op]) return;
    const value = readers[op]();
    const name = $('#userModalName') ? $('#userModalName').textContent : '#' + id;

    let confirmSpec = null;
    if (op === 'set_status' && value === 'banned') {
      confirmSpec = { title: '封禁这个账号？', body: name + ' 将立刻被踢下线，之后无法登录、发帖、评论与私信。', confirmText: '封禁', danger: true };
    } else if (op === 'rename') {
      if (value.length < 2 || value.length > 16) return toast('昵称需为 2–16 字', 'danger');
      confirmSpec = { title: '确认改名？', body: '将把「' + name + '」的昵称改为「' + value + '」，用户本人会立刻看到新昵称。', confirmText: '改名', danger: true };
    } else if (op === 'reset_exp') {
      confirmSpec = { title: '重置经验？', body: '「' + name + '」的经验归零、等级回到 Lv.1，该操作不可撤销。', confirmText: '重置', danger: true };
    } else if (op === 'clear_nickname_flag') {
      confirmSpec = { title: '清除昵称预审标记？', body: '清除后视为人工放行，该昵称不再标记为待复核。', confirmText: '清除', danger: false };
    } else if (op === 'set_level' && (!Number.isFinite(value) || value < 1 || value > 99)) {
      return toast('等级需为 1–99', 'danger');
    } else if (op === 'set_exp' && (!Number.isFinite(value) || value < 0)) {
      return toast('经验需为不小于 0 的整数', 'danger');
    }

    if (confirmSpec) {
      const yes = await confirmDialog(confirmSpec);
      if (!yes) return;
    }
    if (el) el.disabled = true;
    const VERB = {
      set_title: '更新头衔', set_level: '设置等级', set_exp: '设置经验',
      reset_exp: '重置经验', set_status: '更新状态', rename: '改名', clear_nickname_flag: '清除预审标记'
    };
    try {
      await store.userAction(id, op, value);
      toast('已' + (VERB[op] || op) + '：' + name, op === 'set_status' && value === 'banned' ? 'danger' : 'ok');
      // 列表静默刷新 + 详情重新拉取：两处都不能留着旧数据
      await refreshUsersList();
      if ($('#modal').hidden) openModal(userModalShell());
      await loadUserDetail(id);
    } catch (e) {
      if (el) el.disabled = false;
      toast('操作失败：' + errText(e), 'danger');
    }
  }

  async function runBulk(action, confirmSpec) {
    const ids = Array.from(state.queueSel);
    if (!ids.length) return;
    if (confirmSpec) {
      const yes = await confirmDialog(Object.assign({ body: '将影响 ' + ids.length + ' 条内容。' }, confirmSpec));
      if (!yes) return;
    }
    const map = { 'bulk-approve': 'approve', 'bulk-reject': 'reject', 'bulk-remove': 'remove' };
    try {
      const res = await store.bulk(state.queueType, ids, map[action]);
      toast('批量处理完成：成功 ' + res.updated.length + ' 条' + (res.skipped.length ? '，跳过 ' + res.skipped.length + ' 条' : ''), 'ok');
      state.queueSel.clear();
      await refreshAfterAction();
    } catch (e) {
      toast('批量操作失败：' + errText(e), 'danger');
    }
  }

  async function refreshAfterAction() {
    try {
      state.stats = await store.stats();
    } catch (e) { /* 计数刷新失败不阻塞操作反馈 */ }
    updateNavCounts();
    setVersionStatus();
    await renderCurrent();
    if (!$('#modal').hidden) closeModal();
  }

  /* ───────────────────────── 设置弹窗 ───────────────────────── */

  function openSettings() {
    const card = $('#settingsCard');
    card.innerHTML = '<div class="modal-head"><div><h2 id="settingsTitle">连接后端</h2>'
      + '<p class="sub">填入管理员令牌即可直连审核接口；令牌只存在本机浏览器里。</p></div>'
      + '<button class="iconbtn" type="button" data-close aria-label="关闭">' + CLOSE_ICON + '</button></div>'
      + '<div class="modal-body">'
      + '<div class="field"><label for="setBase">API 地址</label>'
      + '<input id="setBase" type="url" inputmode="url" placeholder="留空 = 与当前页面同源" value="' + esc(state.base) + '">'
      + '<span class="hint">同一域名部署时留空即可，例如由后端以 INDEX_FILE=admin.html 提供本页。</span></div>'
      + '<div class="field"><label for="setToken">管理员令牌（ADMIN_TOKEN）</label>'
      + '<input id="setToken" type="password" autocomplete="off" placeholder="至少 24 位" value="' + esc(state.token) + '">'
      + '<span class="hint">令牌只保存在本机浏览器 localStorage，不会上传到任何第三方。</span></div>'
      + '<div class="field"><label>服务端版本</label>'
      + '<span class="hint" id="setVersion">' + esc(versionLabel(state.stats)) + '</span>'
      + '<span class="hint">来自 /api/admin/stats 的 version 字段，后台不能在这里修改。</span></div>'
      + '</div>'
      + '<div class="modal-foot">'
      + '<button class="btn btn-ghost" type="button" data-act="clear-token">清除令牌</button>'
      + '<span class="spacer" style="flex:1"></span>'
      + '<button class="btn btn-secondary" type="button" data-close>取消</button>'
      + '<button class="btn btn-primary" type="button" data-act="save-settings">保存并连接</button>'
      + '</div>';
    $('#settingsModal').hidden = false;
    const input = $('#setToken');
    if (input) input.focus();
  }
  function closeSettings() { $('#settingsModal').hidden = true; }

  async function saveSettings() {
    state.base = String($('#setBase').value || '').trim().replace(/\/+$/, '');
    state.token = String($('#setToken').value || '').trim();
    try {
      if (state.base) localStorage.setItem(LS_BASE, state.base); else localStorage.removeItem(LS_BASE);
      if (state.token) localStorage.setItem(LS_TOKEN, state.token); else localStorage.removeItem(LS_TOKEN);
    } catch (e) { /* 隐私模式下 localStorage 可能不可用 */ }
    closeSettings();
    await tryConnect(true);
    await renderCurrent();
  }

  async function tryConnect(announce) {
    if (!state.token) {
      state.lastError = '未填写管理员令牌';
      setBanner();
      if (announce) toast('未填写管理员令牌，不会加载任何数据', 'warn');
      return;
    }
    try {
      state.stats = await api('/api/admin/stats');
      state.lastError = null;
      if (announce) toast('已连接后端 API', 'ok');
    } catch (e) {
      state.lastError = e.status === 401 ? '令牌无效或已过期' : '无法连接后端';
      if (announce) toast(state.lastError, 'danger');
    }
    setBanner();
    updateNavCounts();
    setVersionStatus();
  }

  /* ───────────────────────── 事件绑定 ───────────────────────── */

  function onContentClick(e) {
    const target = e.target.closest('[data-act]');
    if (!target) return;
    const act = target.dataset.act;
    const id = target.dataset.id;

    if (act === 'refresh') return renderCurrent();
    if (act === 'goto-audit') return setView('audit');
    if (act === 'view') return runAction('view', id, target);
    if (act === 'bulk-approve') return runBulk('bulk-approve', { title: '批量通过？', confirmText: '批量通过', danger: false });
    if (act === 'bulk-reject') return runBulk('bulk-reject', { title: '批量驳回？', confirmText: '批量驳回', danger: true });
    if (act === 'bulk-remove') return runBulk('bulk-remove', { title: '批量下架？', body: '下架后将从公开墙移除。', confirmText: '批量下架', danger: true });
    if (act === 'clear-sel') { state.queueSel.clear(); return renderCurrent(); }
    if (act === 'load-more') return renderQueue(true);
    if (act === 'afdian-more') return renderAfdian(true);
    if (act === 'users-prev') return pageUsers(false);
    if (act === 'users-next') return pageUsers(true);
    return runAction(act, id, target);
  }

  function onContentChange(e) {
    if (e.target.matches('[data-sel]')) {
      const id = Number(e.target.dataset.sel);
      if (e.target.checked) state.queueSel.add(id); else state.queueSel.delete(id);
      const bar = $('.bulkbar');
      const next = bulkBarHtml();
      if (bar) { if (next) bar.outerHTML = next; else bar.remove(); }
      else if (next) { $('#view-queue').insertAdjacentHTML('beforeend', next); }
      return;
    }
  }

  function wireEvents() {
    $('.nav-rail').addEventListener('click', (e) => {
      const btn = e.target.closest('.nav-item');
      if (btn) setView(btn.dataset.view);
    });
    $('#content').addEventListener('click', onContentClick);
    $('#content').addEventListener('change', onContentChange);

    $('#refreshBtn').addEventListener('click', renderCurrent);
    $('#openSettings').addEventListener('click', openSettings);
    $('#bannerSettings').addEventListener('click', openSettings);

    let searchTimer = null;
    $('#searchInput').addEventListener('input', (e) => {
      const value = e.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.queueQuery = value.trim();
        state.queueSel.clear();
        renderQueue();
      }, 220);
    });

    // 分区切换（帖子 / 评论 / 主题 / 回复）：换类型就把搜索词与选择清空，避免隐式过滤
    $('#view-queue').addEventListener('click', (e) => {
      const t = e.target.closest('[data-qtype]');
      if (t) {
        state.queueType = t.dataset.qtype;
        state.queueSel.clear();
        state.queueQuery = '';
        if ($('#searchInput')) $('#searchInput').value = '';
        syncQueueSearch();
        renderQueue();
        return;
      }
      const r = e.target.closest('[data-rstatus]');
      if (r) { state.reportStatus = r.dataset.rstatus; renderReports(); return; }
      const a = e.target.closest('[data-afilter]');
      if (a) { state.auditAction = a.dataset.afilter; renderAudit(); return; }
    });
    $('#view-reports').addEventListener('click', (e) => {
      const r = e.target.closest('[data-rstatus]');
      if (r) { state.reportStatus = r.dataset.rstatus; renderReports(); }
    });
    $('#view-audit').addEventListener('click', (e) => {
      const a = e.target.closest('[data-afilter]');
      if (a) { state.auditAction = a.dataset.afilter; renderAudit(); }
    });
    $('#view-feedback').addEventListener('click', (e) => {
      const f = e.target.closest('[data-fstatus]');
      if (f) { state.feedbackStatus = f.dataset.fstatus; renderFeedback(); }
    });

    // 赞助视图：换筛选一律重拉第一页（保留搜索以外的状态简单即可），翻页状态一并清空
    $('#view-afdian').addEventListener('click', (e) => {
      const f = e.target.closest('[data-afdfilter]');
      if (!f) return;
      state.afdianFilter = f.dataset.afdfilter;
      state.afdianNext = null;
      renderAfdian();
    });
    // 回调排查是原生 <details>：只在状态里记一下展开与否，重绘后不弹回去
    $('#view-afdian').addEventListener('toggle', (e) => {
      if (e.target && e.target.id === 'afHookDetails') state.afdianHooksOpen = e.target.open;
    }, true);

    // 用户视图：状态筛选与搜索。搜索做防抖，且只重绘列表（工具条不重建 = 焦点不丢）
    $('#view-users').addEventListener('click', (e) => {
      const u = e.target.closest('[data-ustatus]');
      if (!u) return;
      state.usersStatus = u.dataset.ustatus;
      state.usersCursor = 0;
      state.usersStack = [];
      state.usersNext = null;
      renderUsers();
    });
    let userSearchTimer = null;
    $('#view-users').addEventListener('input', (e) => {
      if (!e.target || e.target.id !== 'userSearch') return;
      const value = e.target.value;
      clearTimeout(userSearchTimer);
      userSearchTimer = setTimeout(() => {
        state.usersQuery = value.trim();
        state.usersCursor = 0;
        state.usersStack = [];
        state.usersNext = null;
        renderUsers();
      }, 220);
    });

    // 弹窗：关闭按钮 / 背景 / Esc
    $('#modal').addEventListener('click', (e) => {
      if (e.target.closest('[data-close]')) { closeModal(); return; }
      if (e.target === $('#modal')) closeModal();
    });
    // 详情弹窗内的审核动作（弹窗在 #content 之外，需要单独委托）
    $('#modalCard').addEventListener('click', (e) => {
      const t = e.target.closest('[data-act]');
      if (!t) return;
      if (t.dataset.act === 'refresh') { closeModal(); return renderCurrent(); }
      runAction(t.dataset.act, t.dataset.id, t);
    });
    // 绑定弹层里回车即提交，省一次伸手点按钮
    $('#modalCard').addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || !e.target || e.target.id !== 'afUuid') return;
      e.preventDefault();
      const btn = $('#modalCard [data-act="afdian.bind.save"]');
      if (btn) runAction('afdian.bind.save', btn.dataset.id, btn);
    });
    // 弹层内的即时反馈：头衔颜色色块、公告字数
    $('#modalCard').addEventListener('input', (e) => {
      const t = e.target;
      if (!t) return;
      if (t.id === 'tColor') {
        const sw = $('#tSwatch');
        if (sw) sw.style.background = safeColor(t.value) || 'transparent';
      } else if (t.id === 'aBody') {
        const n = $('#aCount');
        if (n) n.textContent = String(t.value || '').length;
      }
    });
    $('#settingsModal').addEventListener('click', (e) => {
      if (e.target.closest('[data-close]')) { closeSettings(); return; }
      if (e.target.closest('[data-act="save-settings"]')) { saveSettings(); return; }
      if (e.target.closest('[data-act="clear-token"]')) { $('#setToken').value = ''; return; }
      if (e.target === $('#settingsModal')) closeSettings();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeModal(); closeSettings(); return; }
      if (e.key === '/' && !$('#searchWrap').hidden) {
        const tag = (document.activeElement && document.activeElement.tagName) || '';
        if (tag !== 'INPUT' && tag !== 'TEXTAREA') { e.preventDefault(); $('#searchInput').focus(); }
      }
    });
  }

  /* ───────────────────────── 启动 ───────────────────────── */

  async function boot() {
    wireEvents();
    setBanner();
    await tryConnect(false);
    setView('overview');
  }

  boot();
})();
</script>
</body>
</html>
