<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>后台审核 · 校园表白墙</title>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ── 设计令牌（沿用 web/src/styles/tokens.css 的 Apple 契约值）── */
:root {
  --bg:#ffffff; --surface:#f5f5f7; --surface-warm:#fbfbfd;
  --fg:#1d1d1f; --fg-2:#424245; --muted:#6e6e73; --meta:#86868b;
  --border:#d2d2d7; --border-soft:#e8e8ed;
  --accent:#0071e3; --accent-on:#ffffff; --accent-hover:#0077ed; --accent-active:#0066cc;
  --success:#16a34a; --warn:#eab308; --danger:#dc2626;
  /* 文本级状态色：为满足正文对比度 ≥ 4.5:1，比装饰色更深一档 */
  --success-ink:#15803d; --warn-ink:#a16207; --danger-ink:#b91c1c;

  --font-display:"SF Pro Display","SF Pro Icons","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-body:"SF Pro Text","SF Pro Icons","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Monaco,Consolas,monospace;

  --text-xs:12px; --text-sm:14px; --text-base:17px; --text-lg:21px;
  --text-xl:28px; --text-2xl:40px; --text-3xl:56px;
  --leading-body:1.47; --leading-tight:1.15; --tracking-display:-0.015em;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-12:48px;

  --radius-sm:8px; --radius-md:12px; --radius-lg:18px; --radius-pill:980px;
  --elev-ring:0 0 0 1px var(--border);
  --shadow-card:0 1px 2px color-mix(in oklab, var(--fg) 6%, transparent);
  --shadow-lift:0 16px 40px color-mix(in oklab, var(--fg) 12%, transparent);
  --focus-ring:0 0 0 4px color-mix(in oklab, var(--accent), transparent 65%);

  --motion-fast:150ms; --motion-base:220ms; --ease-standard:cubic-bezier(.28,0,.22,1);

  --accent-soft:color-mix(in oklab, var(--accent) 12%, transparent);
  --accent-tint:color-mix(in oklab, var(--accent) 6%, transparent);
  --fg-soft:color-mix(in oklab, var(--fg) 5%, transparent);
  --hair:color-mix(in oklab, var(--fg) 9%, transparent);
  --overlay:color-mix(in oklab, var(--fg) 42%, transparent);
}

*,*::before,*::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--surface); color: var(--fg);
  font: var(--text-base)/var(--leading-body) var(--font-body);
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,p,ul,ol,figure { margin: 0; }
ul,ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.meta { color: var(--muted); font-size: var(--text-sm); }
.meta-dim { color: var(--meta); font-size: var(--text-xs); }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* ── 布局外壳 ── */
.shell { display: grid; grid-template-columns: 240px minmax(0,1fr); min-height: 100dvh; }
.sidebar {
  position: sticky; top: 0; height: 100dvh; background: var(--bg);
  border-right: 1px solid var(--border-soft);
  display: flex; flex-direction: column; gap: var(--space-5);
  padding: var(--space-5) var(--space-4);
}
.brand { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-2); }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--fg); color: var(--bg);
  display: grid; place-items: center; flex: none; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-text strong { font: 600 15px/1.2 var(--font-display); letter-spacing: -0.01em; }
.brand-text span { color: var(--muted); font-size: var(--text-xs); }

.nav-rail { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 10px 12px; border: 0; background: transparent; border-radius: var(--radius-sm);
  color: var(--fg-2); font-size: 15px; min-height: 44px;
  transition: background var(--motion-fast) var(--ease-standard);
}
.nav-item svg { flex: none; color: var(--muted); }
.nav-item .nav-label { flex: 1 1 auto; min-width: 0; }
.nav-item:hover { background: var(--fg-soft); }
.nav-item[aria-current="page"] { background: var(--accent-tint); color: var(--accent); font-weight: 600; }
.nav-item[aria-current="page"] svg { color: var(--accent); }
.nav-count { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--bg);
  background: var(--muted); border-radius: var(--radius-pill); padding: 1px 7px; min-width: 22px; text-align: center; }
.nav-count[data-tone="warn"] { background: var(--danger); }
.nav-count:empty { display: none; }

.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--space-3); }
.conn { display: flex; align-items: center; gap: 8px; padding: 0 var(--space-2); color: var(--muted); font-size: var(--text-xs); }
.conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
.conn[data-mode="live"] .dot { background: var(--success); }
.conn[data-mode="demo"] .dot { background: var(--warn); }

.main { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 20; background: color-mix(in oklab, var(--surface) 88%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4);
  padding: var(--space-5) clamp(16px,3vw,32px) var(--space-4);
}
.topbar-lead h1 { font: 600 var(--text-xl)/var(--leading-tight) var(--font-display); letter-spacing: var(--tracking-display); }
.topbar-lead .sub { color: var(--muted); font-size: var(--text-sm); margin-top: 4px; }
.topbar-actions { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; justify-content: flex-end; }
.search { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-pill); padding: 0 14px; height: 38px; min-width: 240px; }
.search svg { color: var(--meta); flex: none; }
.search input { border: 0; background: transparent; outline: none; width: 100%; min-width: 0; font-size: 15px; height: 100%; }

.content { width: 100%; max-width: 1120px; margin: 0 auto; padding: var(--space-6) clamp(16px,3vw,32px) var(--space-12); }
.view { display: block; }

/* ── 通用控件 ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid transparent; border-radius: var(--radius-pill); padding: 0 16px; height: 38px;
  font-size: 15px; font-weight: 500; background: var(--bg); color: var(--fg);
  transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-sm { height: 32px; padding: 0 12px; font-size: var(--text-sm); }
.btn-block { width: 100%; }
.btn-primary { background: var(--accent); color: var(--accent-on); }
.btn-primary:not(:disabled):hover { background: var(--accent-hover); }
.btn-primary:not(:disabled):active { background: var(--accent-active); }
.btn-secondary { background: var(--bg); border-color: var(--border); color: var(--fg); }
.btn-secondary:not(:disabled):hover { border-color: var(--fg); }
.btn-ghost { background: transparent; color: var(--fg-2); }
.btn-ghost:not(:disabled):hover { background: var(--fg-soft); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:not(:disabled):hover { background: color-mix(in oklab, var(--danger) 88%, #000); }
.btn-danger-ghost { background: transparent; color: var(--danger-ink); }
.btn-danger-ghost:not(:disabled):hover { background: color-mix(in oklab, var(--danger) 10%, transparent); }

.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: var(--radius-pill);
  background: var(--surface); color: var(--fg-2); font-size: var(--text-xs); font-weight: 600; }
.chip-soft { background: var(--accent-tint); color: var(--accent-active); }
.flag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: var(--radius-pill);
  font-size: var(--text-xs); font-weight: 600; background: color-mix(in oklab, var(--danger) 10%, transparent); color: var(--danger-ink); }
.flag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.flag[data-kind="banned"] { background: color-mix(in oklab, var(--warn) 18%, transparent); color: var(--warn-ink); }
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: var(--radius-pill);
  font-size: var(--text-xs); font-weight: 600; background: var(--surface); color: var(--muted); }
.badge[data-status="open"] { background: color-mix(in oklab, var(--danger) 10%, transparent); color: var(--danger-ink); }
.badge[data-status="actioned"] { background: color-mix(in oklab, var(--success) 14%, transparent); color: var(--success-ink); }
.badge[data-status="pending"] { background: color-mix(in oklab, var(--warn) 18%, transparent); color: var(--warn-ink); }

.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; gap: 2px; padding: 3px; background: color-mix(in oklab, var(--fg) 6%, transparent); border-radius: var(--radius-pill); }
.seg button { border: 0; background: transparent; border-radius: var(--radius-pill); height: 32px; padding: 0 16px; white-space: nowrap;
  font-size: var(--text-sm); font-weight: 500; color: var(--fg-2); min-height: 32px; }
.seg button[aria-selected="true"] { background: var(--bg); color: var(--fg); box-shadow: var(--shadow-card); font-weight: 600; }

.card { background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--radius-lg); }
.card-pad { padding: var(--space-5); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border-soft); }
.card-head h2 { font: 600 var(--text-lg)/1.2 var(--font-display); letter-spacing: -0.01em; }
.card-head .sub { color: var(--muted); font-size: var(--text-sm); }

.banner { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;
  background: color-mix(in oklab, var(--warn) 14%, var(--bg)); border: 1px solid color-mix(in oklab, var(--warn) 40%, transparent);
  border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: var(--space-5); }
.banner p { font-size: var(--text-sm); color: var(--fg-2); flex: 1 1 220px; min-width: 0; }
.banner strong { color: var(--fg); }

/* ── 概览 ── */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-3); }
.tile { background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--radius-lg); padding: var(--space-5); }
.tile .num { font-family: var(--font-mono); font-size: clamp(30px, 4vw, 40px); line-height: 1.05; font-weight: 600; letter-spacing: -0.02em; display: block; }
.tile .cap { color: var(--muted); font-size: var(--text-sm); display: block; margin-top: 6px; }
.tile[data-tone="danger"] .num { color: var(--danger-ink); }
.tile[data-tone="warn"] .num { color: var(--warn-ink); }
.tile[data-tone="accent"] .num { color: var(--accent); }

.overview-grid { display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr); gap: var(--space-5); margin-top: var(--space-5); }
.age-strip { display: flex; align-items: baseline; gap: 10px; padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border-soft); }
.age-strip .label { color: var(--muted); font-size: var(--text-sm); }
.age-strip .value { font-family: var(--font-mono); font-size: var(--text-lg); font-weight: 600; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--space-4) var(--space-5); }
.kv .od-field .k { color: var(--muted); font-size: var(--text-sm); }
.kv .od-field .v { font-family: var(--font-mono); font-size: var(--text-lg); font-weight: 600; }
.kv .od-field .h { color: var(--meta); font-size: var(--text-xs); }

/* ── 队列 / 工单 列表 ── */
.toolbar { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-4); }
.toolbar > * { min-width: 0; }
.toolbar .spacer { flex: 1 1 auto; }
.q-list { display: flex; flex-direction: column; gap: var(--space-3); }
.q-row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: var(--space-4); align-items: start;
  background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: var(--space-4); }
.q-row:hover { border-color: var(--border); }
.check { display: grid; place-items: center; width: 24px; height: 24px; margin-top: 2px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.q-main { min-width: 0; }
.q-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.q-body { font-size: var(--text-base); color: var(--fg); overflow-wrap: anywhere; }
.q-context { font-size: var(--text-sm); color: var(--muted); margin-top: 8px; overflow-wrap: anywhere; }
.q-foot { margin-top: 8px; display: flex; gap: var(--space-4); flex-wrap: wrap; }
.q-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

.bulkbar { position: sticky; bottom: var(--space-4); z-index: 15; display: flex; align-items: center; gap: var(--space-3);
  flex-wrap: wrap; background: var(--fg); color: var(--bg); border-radius: var(--radius-lg); padding: 12px 16px;
  box-shadow: var(--shadow-lift); margin-top: var(--space-4); }
.bulkbar .count { font-size: var(--text-sm); font-weight: 600; }
.bulkbar .spacer { flex: 1 1 auto; }
.bulkbar .btn { height: 34px; }
.bulkbar .btn-secondary { background: transparent; border-color: color-mix(in oklab, var(--bg) 40%, transparent); color: var(--bg); }
.bulkbar .btn-secondary:hover { border-color: var(--bg); }
.bulkbar .btn-primary { background: var(--bg); color: var(--fg); }
.bulkbar .btn-danger { background: var(--danger); color: #fff; }

.a-row { display: flex; align-items: flex-start; gap: var(--space-3); padding: 14px var(--space-5); border-bottom: 1px solid var(--border-soft); }
.a-row:last-child { border-bottom: 0; }
.a-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 8px; }
.a-row[data-kind="danger"] .a-dot { background: var(--danger); }
.a-row[data-kind="ok"] .a-dot { background: var(--success); }
.a-main { min-width: 0; flex: 1 1 auto; }
.a-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.a-line strong { font-weight: 600; font-size: var(--text-sm); }

.empty { display: grid; place-items: center; gap: 10px; text-align: center; padding: var(--space-12) var(--space-5); color: var(--muted); }
.empty .empty-title { color: var(--fg); font-weight: 600; font-size: var(--text-lg); font-family: var(--font-display); }
.empty p { max-width: 420px; font-size: var(--text-sm); }

.skel { display: flex; flex-direction: column; gap: var(--space-3); }
.skel .row { height: 92px; border-radius: var(--radius-md); background: linear-gradient(90deg, var(--surface) 25%, #ececf0 37%, var(--surface) 63%);
  background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }

@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }

/* ── 弹窗 / 抽屉 / Toast ── */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: var(--space-4);
  background: var(--overlay); animation: fade var(--motion-fast) var(--ease-standard); }
.modal[hidden] { display: none; }
.modal-card { width: min(560px, 100%); max-height: min(86dvh, 820px); overflow: auto; background: var(--bg);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lift); animation: pop var(--motion-base) var(--ease-standard); }
.modal-card.wide { width: min(720px, 100%); }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3);
  padding: var(--space-5) var(--space-5) var(--space-4); border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; background: var(--bg); }
.modal-head h2 { font: 600 var(--text-lg)/1.25 var(--font-display); }
.modal-head .sub { color: var(--muted); font-size: var(--text-sm); margin-top: 4px; }
.modal-body { padding: var(--space-5); }
.modal-foot { display: flex; gap: var(--space-3); justify-content: flex-end; padding: var(--space-4) var(--space-5) var(--space-5); flex-wrap: wrap; }
.iconbtn { width: 36px; height: 36px; border-radius: var(--radius-sm); border: 0; background: transparent; color: var(--muted);
  display: grid; place-items: center; flex: none; min-height: 36px; }
.iconbtn:hover { background: var(--fg-soft); color: var(--fg); }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--space-4); }
.field label { font-size: var(--text-sm); font-weight: 600; }
.field .hint { color: var(--muted); font-size: var(--text-xs); }
.field input { height: 42px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 12px; background: var(--bg); }
.field input:focus { border-color: var(--accent); }

.detail-body { display: flex; flex-direction: column; gap: var(--space-5); }
.detail-quote { background: var(--surface); border-radius: var(--radius-md); padding: var(--space-4); font-size: var(--text-base); overflow-wrap: anywhere; }
.detail-list { display: flex; flex-direction: column; }
.detail-item { padding: 12px 0; border-bottom: 1px solid var(--border-soft); font-size: var(--text-sm); overflow-wrap: anywhere; }
.detail-item:last-child { border-bottom: 0; }

    const items = demoState.reports
      .filter((r) => status === 'all' || r.status === status)
      .sort((a, b) => b.id - a.id)
      .map((r) => {
        const post = postById(r.post_id);
        const comment = r.comment_id ? demoState.comments.find((c) => c.id === r.comment_id) : null;
        return Object.assign({}, r, {
          post_body: post ? post.body : null,
          post_cat: post ? post.cat : null,
          post_status: post ? post.status : null,
          comment_body: comment ? comment.body : null
        });
      });
    return { items, total: items.length, status };
  }

  function demoAudit(action) {
    const items = demoState.audit
      .filter((a) => !action || a.action === action)
      .sort((a, b) => b.id - a.id);
    return { items, total: items.length };
  }

  // 演示模式下的反馈队列：IP / UA 哈希这类隐私字段压根不进演示数据，
  // 与真实接口的「后台不展示」保持一致。
  function demoFeedback(status) {
    const items = demoState.feedback
      .filter((f) => status === 'all' || f.status === status)
      .sort((a, b) => b.id - a.id);
    return { items, total: items.length, status };
  }

  function demoResolveFeedback(id, action) {
    const item = demoState.feedback.find((f) => f.id === id);
    if (!item) throw new Error('not_found');
    item.status = action === 'done' ? 'done' : 'dismissed';
    item.resolved_at = Date.now();
    pushAudit('feedback.' + (action === 'done' ? 'done' : 'dismiss'), id, null);
    return { id, status: item.status };
  }

  function pushAudit(action, target, note) {
    demoState.audit.unshift({ id: demoState.nextAuditId++, action, target: String(target), note: note || null, created_at: Date.now() });
    if (demoState.audit.length > 60) demoState.audit.pop();
  }

  function demoReviewPost(id, action) {
    const post = postById(id);
    if (!post) throw new Error('not_found');
    const from = post.status;
    post.status = action === 'approve' ? 'approved' : action === 'reject' ? 'rejected' : 'removed';
    if (from === 'pending' && action === 'approve') demoState.approvedDelta += 1;
    if (from === 'approved' && action === 'remove') demoState.approvedDelta -= 1;
    if (action === 'remove') {
      demoState.reports.forEach((r) => {
        if (r.post_id === id && r.status === 'open') { r.status = 'actioned'; r.resolved_at = Date.now(); }
      });
    }
    pushAudit('post.' + action, id, 'from:' + from);
    return { id, status: post.status, from };
  }

  function demoReviewComment(id, action) {
    const comment = demoState.comments.find((c) => c.id === id);
    if (!comment) throw new Error('not_found');
    const next = action === 'approve' ? 'approved' : 'rejected';
    const delta = (next === 'approved' && comment.status !== 'approved') ? 1 : (next !== 'approved' && comment.status === 'approved') ? -1 : 0;
    comment.status = next;
    if (delta) {
      const post = postById(comment.post_id);
      if (post) post.comment_count = Math.max(0, post.comment_count + delta);
    }
    pushAudit('comment.' + action, id, delta ? 'post:' + comment.post_id + ' delta:' + delta : null);
    return { id, status: next, commentCountDelta: delta };
  }

  function demoResolveReport(id, action) {
    const report = demoState.reports.find((r) => r.id === id);
    if (!report) throw new Error('not_found');
    if (action === 'takedown') {
      const post = postById(report.post_id);
      if (post && post.status === 'approved') { post.status = 'removed'; demoState.approvedDelta -= 1; }
      demoState.reports.forEach((r) => {
        if (r.post_id === report.post_id && r.status === 'open') { r.status = 'actioned'; r.resolved_at = Date.now(); }
      });
    } else {
      report.status = 'dismissed';
      report.resolved_at = Date.now();
    }
    pushAudit('report.' + action, id, 'post:' + report.post_id);
    return { id, action };
  }

  function demoBulk(type, ids, action) {
    const updated = [], skipped = [];
    ids.forEach((id) => {
      try {
        if (type === 'posts') demoReviewPost(id, action); else demoReviewComment(id, action);
        updated.push(id);
      } catch (e) { skipped.push(id); }
    });
    return { type, action, updated, skipped };
  }

  function demoDetail(id) {
    const post = postById(id);
    if (!post) throw new Error('not_found');
    return {
      post: {
        id: post.id, cat: post.cat, body: post.body, status: post.status, flag: post.flag,
        likes: post.like_count, comments: post.comment_count, createdAt: post.created_at, reviewedAt: null
      },
      comments: demoState.comments.filter((c) => c.post_id === id).map((c) => ({
        id: c.id, body: c.body, status: c.status, flag: c.flag, createdAt: c.created_at
      })),
      reports: demoState.reports.filter((r) => r.post_id === id).map((r) => ({
        id: r.id, reason: r.reason, status: r.status, createdAt: r.created_at
      }))
    };
  }

  function authHeaders(extra) {
    const h = Object.assign({}, extra || {});
    if (state.token) h['authorization'] = 'Bearer ' + state.token;
    return h;
  }

  async function api(path, opts) {
    const options = Object.assign({}, opts || {});
    const headers = authHeaders(options.headers);
    if (options.body) headers['content-type'] = 'application/json';
    options.headers = headers;
    const res = await fetch(state.base + path, options);
    const text = await res.text();
    let data = null;
    if (text) { try { data = JSON.parse(text); } catch (e) { data = text; } }
    if (res.status === 401) { const err = new Error('unauthorized'); err.status = 401; throw err; }
    if (!res.ok) { const err = new Error((data && data.error) || ('HTTP ' + res.status)); err.status = res.status; throw err; }
    return data;
  }

  function toast(message, kind) {
    const box = $('#toaster');
    const el = document.createElement('div');
    el.className = 'toast';
    if (kind) el.dataset.kind = kind;
    el.textContent = message;
    box.appendChild(el);
    setTimeout(() => { el.style.transition = 'opacity 200ms ease'; el.style.opacity = '0'; }, 2400);
    setTimeout(() => el.remove(), 2700);
  }

  function setBanner() {
    const banner = $('#banner');
    const conn = $('#conn');
    const text = $('#connText');
    conn.dataset.mode = state.mode;
    if (state.mode === 'live') {
      text.textContent = '已连接后端 API';

    } else {

  function skeleton(rows) {
    let html = '<div class="skel" aria-hidden="true">';
    for (let i = 0; i < (rows || 4); i += 1) html += '<div class="row"></div>';
    return html + '</div>';
  }

  function emptyState(title, body, actionHtml) {
    return '<div class="empty"><div><p class="empty-title">' + esc(title) + '</p><p>' + esc(body) + '</p></div>' + (actionHtml || '') + '</div>';
  }

  function errorState(message) {
    return '<div class="empty"><div><p class="empty-title">加载失败</p><p>' + esc(message || '请稍后重试') + '</p></div>'
      + '<button class="btn btn-secondary" type="button" data-act="refresh">重试</button></div>';
  }

  function flagChips(flag) {
    if (!flag) return '';
    return String(flag).split(',').filter(Boolean).map((f) =>
      '<span class="flag" data-kind="' + flagKind(f) + '">' + esc(flagLabel(f)) + '</span>'
    ).join('');
  }

  function openModal(html) {
    const card = $('#modalCard');
    card.innerHTML = html;
    $('#modal').hidden = false;
    const focusable = card.querySelector('button, input, select, textarea, a[href]');
    if (focusable) focusable.focus();
  }
  function closeModal() {
    if ($('#modal').hidden) return;
    $('#modal').hidden = true;
    $('#modalCard').innerHTML = '';
    if (state.detailTrigger) { state.detailTrigger.focus(); state.detailTrigger = null; }
  }

  function confirmDialog(opts) {
    return new Promise((resolve) => {
      const danger = opts.danger !== false;
      openModal(
        '<div class="modal-head"><div><h2 id="modalTitle">' + esc(opts.title) + '</h2>'
        + (opts.sub ? '<p class="sub">' + esc(opts.sub) + '</p>' : '') + '</div>'
        + '<button class="iconbtn" type="button" data-close aria-label="关闭">' + CLOSE_ICON + '</button></div>'
        + '<div class="modal-body"><p>' + esc(opts.body) + '</p></div>'
        + '<div class="modal-foot">'
        + '<button class="btn btn-secondary" type="button" data-cancel>' + esc(opts.cancelText || '取消') + '</button>'
        + '<button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" type="button" data-confirm>' + esc(opts.confirmText || '确认') + '</button>'
        + '</div>'
      );
      const card = $('#modalCard');
      const onBackdrop = (e) => { if (e.target === $('#modal')) done(false); };
      const done = (val) => {
        $('#modal').removeEventListener('click', onBackdrop);
        closeModal();
        resolve(val);
      };
      card.querySelector('[data-confirm]').addEventListener('click', () => done(true));
      card.querySelector('[data-cancel]').addEventListener('click', () => done(false));
      card.querySelector('[data-close]').addEventListener('click', () => done(false));
      $('#modal').addEventListener('click', onBackdrop);
    });
  }

    const kv = [
      ['数据库体积', fmtBytes(db.fileBytes), '磁盘占用'],
      ['可回收空间', fmtBytes(db.reclaimableBytes), 'VACUUM 可回收'],
      ['WAL 体积', fmtBytes(db.walBytes), '应有界增长'],
      ['页缓存', (db.cacheMb || 0) + ' MB', '按内存自动定档'],

    const countPairs = [['帖子', counts.posts], ['评论', counts.comments], ['点赞', counts.likes], ['工单', counts.reports], ['反馈', counts.feedback], ['审核留痕', counts.audit]];
    let countHtml = '<div class="kv">';
    countPairs.forEach((row) => {
      countHtml += '<div class="od-field"><span class="k">' + esc(row[0]) + '</span><span class="v od-nowrap">' + esc(row[1] == null ? '—' : row[1]) + '</span></div>';
    });

    let auditHtml = '';

      auditHtml = emptyState('暂无审核记录', '通过或驳回内容后，这里会留下可追溯的痕迹。');

          + '<span class="a-dot" aria-hidden="true"></span>'

          + '<span class="meta od-nowrap">#' + esc(a.target || '—') + '</span></div>'

      });

    return tileHtml
      + '<div class="overview-grid">'
      + '<div class="card">' + age

  function reportRowHtml(r) {
    const resolved = r.status !== 'open';
    const post = r.post_body ? ('#' + r.post_id + '：' + r.post_body) : ('帖子 #' + r.post_id + ' 已被删除');
    return '<li class="q-row" data-od-id="report-' + r.id + '">'
      + '<div class="q-main">'
      + '<div class="q-head"><span class="chip" style="background:color-mix(in oklab,var(--danger) 10%,transparent);color:var(--danger-ink)">举报</span>'
      + '<span class="badge" data-status="' + esc(r.status) + '">' + esc(STATUS_LABEL[r.status] || r.status) + '</span>'
      + '<span class="meta od-nowrap">#' + r.id + '</span>'
      + '<span class="meta od-nowrap" title="' + fmtDate(r.created_at) + '">' + timeAgo(r.created_at) + '</span></div>'
      + '<p class="q-body">理由：' + esc(r.reason || '未填写') + '</p>'
      + '<p class="q-context od-clamp-2">被举报帖子 ' + esc(post) + '</p>'
      + (r.comment_body ? '<p class="q-context od-clamp-2">被举报评论：' + esc(r.comment_body) + '</p>' : '')
      + '</div>'
      + '<div class="q-actions">'
      + (resolved
        ? '<button class="btn btn-ghost btn-sm" type="button" data-act="view" data-id="' + r.post_id + '">查看帖子</button>'
        : '<button class="btn btn-danger btn-sm" type="button" data-act="report.takedown" data-id="' + r.id + '">下架内容</button>'
          + '<button class="btn btn-secondary btn-sm" type="button" data-act="report.dismiss" data-id="' + r.id + '">驳回工单</button>'
          + '<button class="btn btn-ghost btn-sm" type="button" data-act="view" data-id="' + r.post_id + '">查看帖子</button>')
      + '</div></li>';
  }

  function reportsHtml(res) {
    const statuses = [['open', '待处理'], ['actioned', '已处理'], ['dismissed', '已驳回'], ['all', '全部']];
    const seg = '<div class="seg" role="tablist" aria-label="工单状态">' + statuses.map((s) =>
      '<button role="tab" type="button" data-rstatus="' + s[0] + '" aria-selected="' + (state.reportStatus === s[0]) + '">' + s[1] + '</button>'
    ).join('') + '</div>';
    const body = res.items.length
      ? '<ul class="q-list">' + res.items.map(reportRowHtml).join('') + '</ul>'
      : emptyState(state.reportStatus === 'open' ? '没有待处理工单' : '没有符合条件的工单', '访客举报后会在这里生成「通知—移除」工单。');
    return '<div class="toolbar">' + seg + '<span class="meta">共 ' + esc(res.total != null ? res.total : res.items.length) + ' 条</span></div>' + body;
  }

  async function renderReports() {
    const el = $('#view-reports');
    el.innerHTML = skeleton(3);
    try {
      const res = await store.reports(state.reportStatus);
      state.cache.reports = res;

  /* ───────────────────────── 渲染：审核日志 ───────────────────────── */

  function auditFiltersHtml() {
    const actions = [['', '全部'], ['post.approve', '通过帖子'], ['post.reject', '驳回帖子'], ['post.remove', '下架帖子'], ['comment.approve', '通过评论'], ['comment.reject', '驳回评论'], ['report.takedown', '举报下架'], ['report.dismiss', '举报驳回']];
    return '<div class="seg" role="tablist" aria-label="动作筛选">' + actions.map((a) =>
      '<button role="tab" type="button" data-afilter="' + a[0] + '" aria-selected="' + (state.auditAction === a[0]) + '">' + a[1] + '</button>'
    ).join('') + '</div>';
  }

  function auditHtml(res) {
    const body = res.items.length
      ? '<div class="card"><div class="detail-list">' + res.items.map((a) =>
          '<div class="a-row" data-kind="' + (ACTION_TONE[a.action] || '') + '">'
          + '<span class="a-dot" aria-hidden="true"></span>'
          + '<div class="a-main"><div class="a-line"><strong>' + esc(ACTION_LABEL[a.action] || a.action) + '</strong>'
          + '<span class="meta od-nowrap">#' + esc(a.target || '—') + '</span></div>'

      : emptyState('没有匹配的日志', '调整筛选条件，或先处理一些待审内容。');

  async function renderAudit() {
    const el = $('#view-audit');
    el.innerHTML = skeleton(4);
    try {
      const res = await store.audit(state.auditAction);
      state.cache.audit = res;

  /* ───────────────────────── 渲染：内测反馈 ───────────────────────── */

  // 超过这个长度的正文默认折叠：一条长文会把后面的反馈全挤出首屏
  const FEEDBACK_CLAMP_AT = 200;

  function feedbackCatChip(cat) {
    const key = FEEDBACK_CAT_LABEL[cat] ? cat : 'other';
    const label = FEEDBACK_CAT_LABEL[key];
    if (key === 'bug') {
      return '<span class="chip" style="background:color-mix(in oklab,var(--danger) 10%,transparent);color:var(--danger-ink)">' + esc(label) + '</span>';
    }
    return '<span class="chip' + (key === 'idea' ? ' chip-soft' : '') + '">' + esc(label) + '</span>';
  }

  // 状态徽标沿用既有 data-status 取值（open 红 / actioned 绿 / 无属性灰），不新增颜色
  function feedbackBadgeAttr(status) {
    if (status === 'open') return ' data-status="open"';
    if (status === 'done') return ' data-status="actioned"';
    return '';
  }

  // 隐私红线：反馈行只渲染 id / 分类 / 正文 / 联系方式 / 时间，
  // 服务端下发的 IP / UA 哈希一律不进 DOM（审核日志视图同理）。
  function feedbackRowHtml(f) {
    const body = String(f.body == null ? '' : f.body);
    const long = body.length > FEEDBACK_CLAMP_AT;
    const expanded = long && state.feedbackExpanded.has(f.id);
    return '<li class="q-row" data-od-id="feedback-' + f.id + '" style="grid-template-columns:minmax(0,1fr) auto">'
      + '<div class="q-main">'
      + '<div class="q-head">' + feedbackCatChip(f.cat)
      + '<span class="badge"' + feedbackBadgeAttr(f.status) + '>' + esc(FEEDBACK_STATUS_LABEL[f.status] || f.status) + '</span>'
      + '<span class="meta od-nowrap">#' + f.id + '</span>'
      + '<span class="meta od-nowrap" title="' + fmtDate(f.created_at) + '">' + timeAgo(f.created_at) + '</span>'
      + (f.resolved_at ? '<span class="meta-dim od-nowrap">结案 ' + fmtDate(f.resolved_at) + '</span>' : '')
      + '</div>'
      + '<p class="q-body' + (long && !expanded ? ' od-clamp-3' : '') + '">' + esc(body) + '</p>'
      + (long
        ? '<div class="q-foot"><button class="btn btn-ghost btn-sm" type="button" data-act="feedback.toggle" data-id="' + f.id
          + '" aria-expanded="' + expanded + '">' + (expanded ? '收起' : '展开全文') + '</button></div>'
        : '')
      + '<p class="q-context">联系方式：' + (f.contact ? esc(f.contact) : '未留联系方式') + '</p>'
      + '</div>'
      + '<div class="q-actions">'
      + (f.status === 'open'
        ? '<button class="btn btn-primary btn-sm" type="button" data-act="feedback.done" data-id="' + f.id + '">标记已处理</button>'
          + '<button class="btn btn-secondary btn-sm" type="button" data-act="feedback.dismiss" data-id="' + f.id + '">忽略</button>'
        : '<span class="meta-dim">已归档 · ' + esc(FEEDBACK_STATUS_LABEL[f.status] || f.status) + '</span>')
      + '</div></li>';
  }

  function feedbackHtml(res) {
    const statuses = [['open', '待处理'], ['done', '已处理'], ['dismissed', '已忽略'], ['all', '全部']];
    const seg = '<div class="seg" role="tablist" aria-label="反馈状态">' + statuses.map((s) =>
      '<button role="tab" type="button" data-fstatus="' + s[0] + '" aria-selected="' + (state.feedbackStatus === s[0]) + '">' + s[1] + '</button>'
    ).join('') + '</div>';
    let body;
    if (res.items.length) {
      body = '<ul class="q-list">' + res.items.map(feedbackRowHtml).join('') + '</ul>';
    } else if (state.feedbackStatus === 'open') {
      body = emptyState('暂无待处理反馈', '内测用户在公开页提交的问题与建议会进入这里，处理完请点「标记已处理」或「忽略」。');
    } else {
      body = emptyState(state.feedbackStatus === 'all' ? '暂无反馈' : '没有符合条件的反馈', '切换上方筛选可以查看其它状态的反馈。');
    }
    return '<div class="toolbar">' + seg + '<span class="meta">共 ' + esc(res.total != null ? res.total : res.items.length) + ' 条</span>'
      + '<span class="spacer"></span>'
      + (state.mode === 'live' ? '' : '<span class="meta-dim">演示数据</span>')
      + '</div>' + body;
  }

  async function renderFeedback() {
    const el = $('#view-feedback');
    el.innerHTML = skeleton(3);
    try {
      const res = await store.feedback(state.feedbackStatus);
      state.cache.feedback = res;
      el.innerHTML = feedbackHtml(res);
      updateNavCounts();
    } catch (e) {
      if (handleApiError(e)) return;
      el.innerHTML = errorState(e.message);
    }
  }

  /* ───────────────────────── 视图切换 / 计数 ───────────────────────── */

  function setView(view) {
    state.view = view;
    const meta = VIEW_META[view];
    $('#viewTitle').textContent = meta.title;
    $('#viewSub').textContent = meta.sub;
    $$('.nav-item').forEach((btn) => {
      if (btn.dataset.view === view) btn.setAttribute('aria-current', 'page');
      else btn.removeAttribute('aria-current');
    });
    ['overview', 'queue', 'reports', 'audit', 'feedback'].forEach((v) => { $('#view-' + v).hidden = v !== view; });
    $('#searchWrap').hidden = view !== 'queue';
    renderCurrent();
  }

  function renderCurrent() {
    if (state.view === 'overview') return renderOverview();
    if (state.view === 'queue') return renderQueue();
    if (state.view === 'reports') return renderReports();
    if (state.view === 'feedback') return renderFeedback();
    return renderAudit();
  }

  function updateNavCounts() {
    const s = state.stats;
    const set = (key, value, tone) => {
      const el = document.querySelector('.nav-count[data-count="' + key + '"]');
      if (!el) return;
      el.textContent = value ? String(value) : '';
      if (tone) el.dataset.tone = tone; else delete el.dataset.tone;
    };
    if (s) {
      set('overview', s.pendingTotal || 0, 'warn');
      set('queue', (s.pendingPosts || 0) + (s.pendingComments || 0), 'warn');
      set('reports', s.openReports || 0, 'warn');
      set('feedback', s.openFeedback || 0, 'warn');
      set('audit', '');
    }
  }

  // 门禁状态与「已连接 / 演示模式」并列展示，互不覆盖：
  // 前者说明写操作是否需要邀请码，后者说明后台自己在跟谁说话。
  // 侧栏常驻一行，同时在「连接设置」里再写一遍，便于排查线上配置。
  function gateLabel(stats) {
    if (stats && stats.gateRequired && stats.gateInviteRequired) return { label: '门禁：已启用（邀请码）', mode: 'live' };
    if (stats && stats.gateRequired) return { label: '门禁：已启用（仅本地挑战）', mode: 'live' };
    return { label: '门禁：未启用', mode: 'demo' }; // 未启用 = 黄色告警点（站点对整个互联网开放）
  }

  function setGateStatus(stats) {
    const s = stats || state.stats;
    if (!s) return;
    const box = $('#gate');
    const text = $('#gateText');
    if (!box || !text) return;
    const info = gateLabel(s);
    box.dataset.mode = info.mode;
    text.textContent = info.label;
  }

  /* ───────────────────────── 帖子详情 ───────────────────────── */

  async function openDetail(id, trigger) {
    state.detailTrigger = trigger || null;
    openModal('<div class="modal-head"><div><h2 id="modalTitle">帖子详情</h2><p class="sub">#' + esc(id) + '</p></div>'
      + '<button class="iconbtn" type="button" data-close aria-label="关闭">' + CLOSE_ICON + '</button></div>'
      + '<div class="modal-body">' + skeleton(2) + '</div>');
    try {
      const data = await store.detail(id);
      const p = data.post;
      const statusBadge = '<span class="badge" data-status="' + (p.status === 'approved' ? 'actioned' : p.status) + '">' + esc(STATUS_LABEL[p.status] || p.status) + '</span>';
      let html = '<div class="detail-body">'
        + '<div class="od-cluster"><span class="chip">' + esc(p.cat) + '</span>' + statusBadge + flagChips(p.flag) + '</div>'
        + '<div class="detail-quote">' + esc(p.body) + '</div>'
        + '<div class="od-row" style="gap:var(--space-5);flex-wrap:wrap"><span class="meta">点赞 <span class="mono">' + esc(p.likes) + '</span></span>'
        + '<span class="meta">评论 <span class="mono">' + esc(p.comments) + '</span></span>'
        + '<span class="meta">发布于 ' + fmtDate(p.createdAt) + '</span></div>';
      if (data.reports && data.reports.length) {
        html += '<div><h3 style="font-size:var(--text-sm);font-weight:600;margin-bottom:8px">相关工单</h3><div class="detail-list">'
          + data.reports.map((r) => '<div class="detail-item">' + esc(r.reason || '未填写') + '<div class="sub">' + esc(STATUS_LABEL[r.status] || r.status) + ' · ' + fmtDate(r.createdAt) + '</div></div>').join('')
          + '</div></div>';
      }
      html += '<div><h3 style="font-size:var(--text-sm);font-weight:600;margin-bottom:8px">评论（' + (data.comments ? data.comments.length : 0) + '）</h3>';
      html += data.comments && data.comments.length
        ? '<div class="detail-list">' + data.comments.map((c) => '<div class="detail-item">' + esc(c.body)
            + '<div class="sub">' + esc(STATUS_LABEL[c.status] || c.status) + ' · ' + fmtDate(c.createdAt) + (c.flag ? ' · ' + esc(flagLabel(c.flag)) : '') + '</div></div>').join('') + '</div>'
        : '<p class="meta">暂无评论。</p>';
      html += '</div></div>';

      const actions = (p.status === 'pending')
        ? '<button class="btn btn-primary" type="button" data-act="post.approve" data-id="' + p.id + '">通过</button>'
          + '<button class="btn btn-secondary" type="button" data-act="post.reject" data-id="' + p.id + '">驳回</button>'
          + '<button class="btn btn-danger-ghost" type="button" data-act="post.remove" data-id="' + p.id + '">下架</button>'
        : (p.status === 'approved' ? '<button class="btn btn-danger-ghost" type="button" data-act="post.remove" data-id="' + p.id + '">下架</button>' : '');

      const card = $('#modalCard');
      card.innerHTML = '<div class="modal-head"><div><h2 id="modalTitle">帖子详情</h2><p class="sub">#' + esc(p.id) + '</p></div>'
        + '<button class="iconbtn" type="button" data-close aria-label="关闭">' + CLOSE_ICON + '</button></div>'
        + '<div class="modal-body">' + html + '</div>'
        + '<div class="modal-foot"><button class="btn btn-secondary" type="button" data-close>关闭</button>' + actions + '</div>';
    } catch (e) {
      if (handleApiError(e)) { closeModal(); return; }
      $('#modalCard').innerHTML = '<div class="modal-head"><div><h2 id="modalTitle">帖子详情</h2></div>'
        + '<button class="iconbtn" type="button" data-close aria-label="关闭">' + CLOSE_ICON + '</button></div>'
        + '<div class="modal-body">' + errorState(e.message) + '</div>';
    }
  }

  /* ───────────────────────── 动作处理 ───────────────────────── */

  // 渲染/操作过程中的接口错误：不改动连接模式，只如实提示并让调用方显示错误态，
  // 避免「后端其实没连上，界面却切换成演示数据」这种误导。
  function handleApiError(e) {
    if (e && e.status === 401) {
      toast('管理员令牌无效或已过期，请在“连接设置”中更新', 'danger');
    }
    return false;
  }

  const NEEDS_CONFIRM = {
    'post.remove': { title: '下架这条内容？', body: '下架后内容将立即从公开墙移除，并连带结清该帖的待处理工单。', confirmText: '下架', danger: true },
    'post.reject': { title: '驳回这条内容？', body: '驳回后内容不会出现在公开墙，帖子会保留在库中以便复查。', confirmText: '驳回', danger: true }
  };

  async function runAction(act, id, el) {
    try {
      // data-act 用的是「带前缀的动作名」（post.approve / comment.reject），
      // 它同时是审核日志里的 action 文案。但接口要的是**裸动作**：
      //   POST /api/admin/posts/:id/approve|reject|remove
      //   POST /api/admin/comments/:id/approve|reject
      // 大坑（已踩过）：直接把 act 拼进 URL 会变成
      //   POST /api/admin/posts/7/post.approve → 404 not_found，
      // 界面上表现为「点通过没反应、只弹一句操作失败」。
      // 演示模式的 demoReviewPost 也按裸动作分支，前缀会一路错到底，
      // 因此统一在这里剥前缀，两处调用点都受益。
      const verb = String(act).split('.').pop();

      if (act === 'post.approve' || act === 'post.reject' || act === 'post.remove') {
        if (NEEDS_CONFIRM[act]) {
          const yes = await confirmDialog(NEEDS_CONFIRM[act]);
          if (!yes) return;
        }
        if (el) el.disabled = true;
        await store.reviewPost(Number(id), verb);
        state.queueSel.delete(Number(id));
        toast('已' + (act === 'post.approve' ? '通过' : act === 'post.reject' ? '驳回' : '下架') + '帖子 #' + id, act === 'post.approve' ? 'ok' : 'danger');
        await refreshAfterAction();
        return;
      }
      if (act === 'comment.approve' || act === 'comment.reject') {
        if (el) el.disabled = true;
        await store.reviewComment(Number(id), verb);
        state.queueSel.delete(Number(id));
        toast('已' + (act === 'comment.approve' ? '通过' : '驳回') + '评论 #' + id, act === 'comment.approve' ? 'ok' : 'danger');
        await refreshAfterAction();
        return;
      }
      if (act === 'report.takedown') {
        const yes = await confirmDialog({ title: '下架被举报内容？', body: '内容将从公开墙移除，该帖的全部待处理工单会一并结案。', confirmText: '下架并结案', danger: true });
        if (!yes) return;
        if (el) el.disabled = true;
        await store.resolveReport(Number(id), 'takedown');
        toast('已下架并结案', 'danger');
        await refreshAfterAction();
        return;
      }
      if (act === 'report.dismiss') {
        if (el) el.disabled = true;
        await store.resolveReport(Number(id), 'dismiss');
        toast('已驳回工单 #' + id, 'ok');
        await refreshAfterAction();
        return;
      }
      if (act === 'feedback.toggle') {
        const fid = Number(id);
        if (state.feedbackExpanded.has(fid)) state.feedbackExpanded.delete(fid);
        else state.feedbackExpanded.add(fid);
        // 只重绘这一行：折叠/展开不需要重新拉取整个队列
        const cached = state.cache.feedback;
        const item = cached && cached.items.filter((x) => x.id === fid)[0];
        const row = el && el.closest('.q-row');
        if (item && row) {
          row.outerHTML = feedbackRowHtml(item);
          const next = $('#view-feedback [data-od-id="feedback-' + fid + '"] [data-act="feedback.toggle"]');
          if (next) next.focus(); // 键盘操作后焦点回到同一个按钮上
        }
        return;
      }
      if (act === 'feedback.done' || act === 'feedback.dismiss') {
        const done = act === 'feedback.done';
        if (el) el.disabled = true;
        await store.resolveFeedback(Number(id), done ? 'done' : 'dismiss');
        toast(done ? '已标记反馈 #' + id + ' 为已处理' : '已忽略反馈 #' + id, done ? 'ok' : 'danger');
        await refreshAfterAction();
        return;
      }
      if (act === 'view') {
        await openDetail(Number(id), el || null);
        return;
      }
    } catch (e) {
      if (el) el.disabled = false;
      if (e.status === 401) { handleApiError(e); toast('登录状态失效，请重新连接后端', 'danger'); return; }
      toast('操作失败：' + e.message, 'danger');
    }
  }

  async function runBulk(action, confirmSpec) {
    const ids = Array.from(state.queueSel);
    if (!ids.length) return;
    if (confirmSpec) {
      const yes = await confirmDialog(Object.assign({ body: '将影响 ' + ids.length + ' 条内容。' }, confirmSpec));
      if (!yes) return;
    }
    const map = { 'bulk-approve': 'approve', 'bulk-reject': 'reject', 'bulk-remove': 'remove' };
    try {
      const res = await store.bulk(state.queueType, ids, map[action]);
      toast('批量处理完成：成功 ' + res.updated.length + ' 条' + (res.skipped.length ? '，跳过 ' + res.skipped.length + ' 条' : ''), 'ok');
      state.queueSel.clear();
      await refreshAfterAction();
    } catch (e) {
      toast('批量操作失败：' + e.message, 'danger');
    }
  }

  async function refreshAfterAction() {
    try {
      state.stats = await store.stats();
    } catch (e) { /* 计数刷新失败不阻塞操作反馈 */ }
    updateNavCounts();
    setGateStatus();
    await renderCurrent();
    if (!$('#modal').hidden) closeModal();
  }

  /* ───────────────────────── 设置弹窗 ───────────────────────── */

  function openSettings() {
    const card = $('#settingsCard');
    card.innerHTML = '<div class="modal-head"><div><h2 id="settingsTitle">连接后端</h2>'
      + '<p class="sub">填入管理员令牌即可直连真实审核接口；留空则使用演示数据。</p></div>'
      + '<button class="iconbtn" type="button" data-close aria-label="关闭">' + CLOSE_ICON + '</button></div>'
      + '<div class="modal-body">'
      + '<div class="field"><label for="setBase">API 地址</label>'
      + '<input id="setBase" type="url" inputmode="url" placeholder="留空 = 与当前页面同源" value="' + esc(state.base) + '">'
      + '<span class="hint">同一域名部署时留空即可，例如由后端以 INDEX_FILE=admin.html 提供本页。</span></div>'
      + '<div class="field"><label for="setToken">管理员令牌（ADMIN_TOKEN）</label>'
      + '<input id="setToken" type="password" autocomplete="off" placeholder="至少 24 位" value="' + esc(state.token) + '">'
      + '<span class="hint">令牌只保存在本机浏览器 localStorage，不会上传到任何第三方。</span></div>'
      + '<div class="field"><label>内测门禁</label>'
      + '<span class="hint" id="setGate">' + esc(gateLabel(state.stats).label) + '</span>'
      + '<span class="hint">由服务端 GATE_ENFORCE / GATE_INVITE_CODES 决定，后台不能在这里改。</span></div>'
      + '</div>'
      + '<div class="modal-foot">'
      + '<button class="btn btn-ghost" type="button" data-act="clear-token">清除令牌</button>'
      + '<span class="spacer" style="flex:1"></span>'
      + '<button class="btn btn-secondary" type="button" data-close>取消</button>'
      + '<button class="btn btn-primary" type="button" data-act="save-settings">保存并连接</button>'
      + '</div>';
    $('#settingsModal').hidden = false;
    const input = $('#setToken');
    if (input) input.focus();
  }
  function closeSettings() { $('#settingsModal').hidden = true; }

  async function saveSettings() {
    state.base = String($('#setBase').value || '').trim().replace(/\/+$/, '');
    state.token = String($('#setToken').value || '').trim();
    try {
      if (state.base) localStorage.setItem(LS_BASE, state.base); else localStorage.removeItem(LS_BASE);
      if (state.token) localStorage.setItem(LS_TOKEN, state.token); else localStorage.removeItem(LS_TOKEN);
    } catch (e) { /* 隐私模式下 localStorage 可能不可用 */ }
    closeSettings();
    await tryConnect(true);
    await renderCurrent();
  }

  async function tryConnect(announce) {
    if (!state.token) {
      state.mode = 'demo';
      state.lastError = null;
      setBanner();
      if (announce) toast('未填写令牌，保持演示模式', 'warn');
      return;
    }
    try {
      state.stats = await api('/api/admin/stats');
      state.mode = 'live';
      state.lastError = null;
      if (announce) toast('已连接后端 API', 'ok');
    } catch (e) {
      state.mode = 'demo';
      if (e.status === 401) state.lastError = '令牌无效或已过期';
      else state.lastError = '无法连接后端';
      if (announce) toast(e.status === 401 ? '令牌无效，请检查后重试' : '无法连接后端，已切换到演示数据', 'danger');
    }
    setBanner();
    // 连接成功后顺手刷新导航计数与门禁状态：一次往返拿齐首屏要用的信息
    updateNavCounts();
    setGateStatus();
  }

  /* ───────────────────────── 事件绑定 ───────────────────────── */

  function onContentClick(e) {
    const target = e.target.closest('[data-act]');
    if (!target) return;
    const act = target.dataset.act;
    const id = target.dataset.id;

    if (act === 'refresh') return renderCurrent();
    if (act === 'goto-audit') return setView('audit');
    if (act === 'view') return runAction('view', id, target);
    if (act === 'bulk-approve') return runBulk('bulk-approve', { title: '批量通过？', confirmText: '批量通过', danger: false });
    if (act === 'bulk-reject') return runBulk('bulk-reject', { title: '批量驳回？', confirmText: '批量驳回', danger: true });
    if (act === 'bulk-remove') return runBulk('bulk-remove', { title: '批量下架？', body: '下架后将从公开墙移除。', confirmText: '批量下架', danger: true });
    if (act === 'clear-sel') { state.queueSel.clear(); return renderCurrent(); }
    if (act === 'load-more') return renderQueue();
    return runAction(act, id, target);
  }

  function onContentChange(e) {
    if (e.target.matches('[data-sel]')) {
      const id = Number(e.target.dataset.sel);
      if (e.target.checked) state.queueSel.add(id); else state.queueSel.delete(id);
      const bar = $('.bulkbar');
      const next = bulkBarHtml();
      if (bar) { if (next) bar.outerHTML = next; else bar.remove(); }
      else if (next) { $('#view-queue').insertAdjacentHTML('beforeend', next); }
      return;
    }
  }

  function wireEvents() {
    $('.nav-rail').addEventListener('click', (e) => {
      const btn = e.target.closest('.nav-item');
      if (btn) setView(btn.dataset.view);
    });
    $('#content').addEventListener('click', onContentClick);
    $('#content').addEventListener('change', onContentChange);

    $('#refreshBtn').addEventListener('click', renderCurrent);
    $('#openSettings').addEventListener('click', openSettings);
    $('#bannerSettings').addEventListener('click', openSettings);

    let searchTimer = null;
    $('#searchInput').addEventListener('input', (e) => {
      const value = e.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.queueQuery = value.trim();
        state.queueSel.clear();
        renderQueue();
      }, 220);
    });

    // 分区切换（帖子 / 评论）
    $('#view-queue').addEventListener('click', (e) => {
      const t = e.target.closest('[data-qtype]');
      if (t) { state.queueType = t.dataset.qtype; state.queueSel.clear(); renderQueue(); return; }
      const r = e.target.closest('[data-rstatus]');
      if (r) { state.reportStatus = r.dataset.rstatus; renderReports(); return; }
      const a = e.target.closest('[data-afilter]');
      if (a) { state.auditAction = a.dataset.afilter; renderAudit(); return; }
    });
    $('#view-reports').addEventListener('click', (e) => {
      const r = e.target.closest('[data-rstatus]');
      if (r) { state.reportStatus = r.dataset.rstatus; renderReports(); }
    });
    $('#view-audit').addEventListener('click', (e) => {
      const a = e.target.closest('[data-afilter]');
      if (a) { state.auditAction = a.dataset.afilter; renderAudit(); }
    });
    $('#view-feedback').addEventListener('click', (e) => {
      const f = e.target.closest('[data-fstatus]');
      if (f) { state.feedbackStatus = f.dataset.fstatus; renderFeedback(); }
    });

    // 弹窗：关闭按钮 / 背景 / Esc
    $('#modal').addEventListener('click', (e) => {
      if (e.target.closest('[data-close]')) { closeModal(); return; }
      if (e.target === $('#modal')) closeModal();
    });
    // 详情弹窗内的审核动作（弹窗在 #content 之外，需要单独委托）
    $('#modalCard').addEventListener('click', (e) => {
      const t = e.target.closest('[data-act]');
      if (!t) return;
      if (t.dataset.act === 'refresh') { closeModal(); return renderCurrent(); }
      runAction(t.dataset.act, t.dataset.id, t);
    });
    $('#settingsModal').addEventListener('click', (e) => {
      if (e.target.closest('[data-close]')) { closeSettings(); return; }
      if (e.target.closest('[data-act="save-settings"]')) { saveSettings(); return; }
      if (e.target.closest('[data-act="clear-token"]')) { $('#setToken').value = ''; return; }
      if (e.target === $('#settingsModal')) closeSettings();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeModal(); closeSettings(); return; }
      if (e.key === '/' && !$('#searchWrap').hidden) {
        const tag = (document.activeElement && document.activeElement.tagName) || '';
        if (tag !== 'INPUT' && tag !== 'TEXTAREA') { e.preventDefault(); $('#searchInput').focus(); }
      }
    });
  }

  /* ───────────────────────── 启动 ───────────────────────── */

  async function boot() {
    wireEvents();
    setBanner();
    await tryConnect(false);
    setView('overview');
  }

  boot();
})();
</script>
</body>
</html>
